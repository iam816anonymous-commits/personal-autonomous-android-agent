name: Kotlin Core

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile Kotlin core
        run: gradle :agent:core:compileKotlin
      - name: Run unit tests
        run: gradle :agent:core:test
      - name: Run Android adapter unit tests
        run: gradle :agent:app:testDebugUnitTest
      - name: Assemble API 27 Android application
        run: gradle :agent:app:assembleDebug

      - name: Upload debug APK for physical-device validation
        uses: actions/upload-artifact@v4
        with:
          name: personal-agent-debug-apk
          path: agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
