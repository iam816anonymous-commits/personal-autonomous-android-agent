name: Kotlin Core

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile Kotlin core
        run: gradle :core:compileKotlin
      - name: Run unit tests
        run: gradle :core:test
      - name: Assemble API 27 Android application
        run: gradle :app:assembleDebug
